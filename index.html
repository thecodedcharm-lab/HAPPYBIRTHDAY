
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Birthday! 🎀</title>
  <meta name="description" content="A little interactive birthday surprise, made with love.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Gaegu:wght@400;700&family=Nunito:wght@400;600;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>


<svg class="svg-sprite" width="0" height="0" aria-hidden="true" focusable="false">
  <defs>
    <symbol id="i-heart" viewBox="0 0 24 24"><path d="M12 21s-7.5-4.6-9.6-9.4C.9 8 3 4.5 6.6 4.5c2 0 3.7 1.1 5.4 3.2 1.7-2.1 3.4-3.2 5.4-3.2 3.6 0 5.7 3.5 4.2 7.1C19.5 16.4 12 21 12 21z"/></symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2l2.9 6.6 7.1.7-5.4 4.8 1.6 7L12 17.4 5.8 21.1l1.6-7L2 9.3l7.1-.7z"/></symbol>
    <symbol id="i-sparkle" viewBox="0 0 24 24"><path d="M12 0c.8 6.2 5.8 11.2 12 12-6.2.8-11.2 5.8-12 12-.8-6.2-5.8-11.2-12-12 6.2-.8 11.2-5.8 12-12z"/></symbol>
    <symbol id="i-flower" viewBox="0 0 40 40">
      <circle cx="20" cy="11" r="7.5"/><circle cx="28.6" cy="17.2" r="7.5"/><circle cx="25.3" cy="27.3" r="7.5"/>
      <circle cx="14.7" cy="27.3" r="7.5"/><circle cx="11.4" cy="17.2" r="7.5"/>
      <circle cx="20" cy="20" r="5" style="fill:var(--flower-center,#FFD35E)"/>
    </symbol>
    <symbol id="i-squiggle" viewBox="0 0 60 12"><path d="M2 6c5-8 10-8 15 0s10 8 15 0 10-8 15 0 8 5 11 2" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round"/></symbol>
    <symbol id="i-arrow" viewBox="0 0 60 30"><path d="M3 22c14-18 34-20 50-6M53 16l-10-1M53 16l-3 10" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></symbol>
    <symbol id="i-camera" viewBox="0 0 24 24"><path d="M4 7h3l1.5-2h7L17 7h3a1 1 0 011 1v10a1 1 0 01-1 1H4a1 1 0 01-1-1V8a1 1 0 011-1z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><circle cx="12" cy="13" r="3.6" fill="none" stroke="currentColor" stroke-width="1.6"/></symbol>
    <symbol id="i-music" viewBox="0 0 24 24"><path d="M9 18V6l10-2v12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><circle cx="6.5" cy="18" r="2.5"/><circle cx="16.5" cy="16" r="2.5"/></symbol>
    <symbol id="i-check" viewBox="0 0 24 24"><path d="M5 12.5l4.5 4.5L19 7.5" fill="none" stroke="currentColor" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  </defs>
</svg>

<main id="app">


  <section class="scene scene--welcome is-active" id="sceneWelcome" aria-label="Birthday welcome">
    <div class="hearts-layer" data-hearts></div>
    <div class="sparkle-field" data-sparkles="22"></div>
    <div class="bunting" data-bunting aria-hidden="true"></div>


    <div class="balloon-bunch balloon-bunch--left" aria-hidden="true">
      <span class="balloon" style="--c:#FFB7D5; --x:0%;  --y:34%; --delay:0s"></span>
      <span class="balloon" style="--c:#DCD6FF; --x:38%; --y:0%;  --delay:-1.6s"></span>
      <span class="balloon" style="--c:#FFF0B8; --x:64%; --y:40%; --delay:-3.2s"></span>
    </div>
    <div class="balloon-bunch balloon-bunch--right" aria-hidden="true">
      <span class="balloon" style="--c:#DCD6FF; --x:60%; --y:36%; --delay:-.8s"></span>
      <span class="balloon" style="--c:#FFB7D5; --x:22%; --y:0%;  --delay:-2.4s"></span>
      <span class="balloon" style="--c:#CDEFE1; --x:0%;  --y:42%; --delay:-4s"></span>
    </div>

    <div class="welcome-content">
      <span class="bow welcome-bow" aria-hidden="true"></span>
      <h1 class="welcome-title">
        <span class="welcome-ribbon" data-text="welcomeTop" data-wave></span>
        <span class="welcome-name"><span data-name data-wave></span>!</span>
      </h1>
      <div class="welcome-lines" data-text="welcomeLines"></div>
      <button class="btn btn--wiggle btn--big" id="openSurpriseBtn" data-text="welcomeButton"></button>
    </div>


    <div class="scallop-floor" aria-hidden="true"></div>
    <span class="cupcake cupcake--left" aria-hidden="true"><i class="cc-wrap"></i><i class="cc-f1"></i><i class="cc-f2"></i><i class="cc-f3"></i><i class="cc-cherry"></i></span>
    <span class="cupcake cupcake--right" style="--wrap:#FFD6E7" aria-hidden="true"><i class="cc-wrap"></i><i class="cc-f1"></i><i class="cc-f2"></i><i class="cc-f3"></i><i class="cc-cherry"></i></span>
  </section>


  <section class="scene scene--book" id="sceneBook" aria-label="The Little Book of You">
    <div class="sparkle-field" data-sparkles="12"></div>

    <div class="book-stage">
      <div class="book is-closed" id="book"></div>
    </div>

    <p class="book-hint" id="bookHint"></p>

    <div class="book-controls is-hidden" id="bookControls">
      <button class="round-btn" id="prevPageBtn" aria-label="Previous page">&#8249;</button>
      <div class="page-dots" id="pageDots" aria-hidden="true"></div>
      <button class="round-btn" id="nextPageBtn" aria-label="Next page">&#8250;</button>
    </div>

    <div id="pageStash" hidden>


      <article class="page page--cover" id="pageCover" role="button" tabindex="0" aria-label="Closed notebook: The Little Book of You. Press to open.">
        <div class="cover-spine"></div>
        <div class="cover-ribbon"></div>
        <span class="bow cover-bow"></span>
        <div class="cover-label">
          <svg class="icon cover-label-star"><use href="#i-sparkle"></use></svg>
          <h2 class="cover-title" data-text="coverTitle"></h2>
          <svg class="icon cover-squiggle"><use href="#i-squiggle"></use></svg>
          <p class="cover-subtitle" data-text="coverSubtitle"></p>
        </div>
        <svg class="icon sticker cover-flower cover-flower--1" style="color:#fff"><use href="#i-flower"></use></svg>
        <svg class="icon sticker cover-flower cover-flower--2" style="color:var(--lavender)"><use href="#i-flower"></use></svg>
        <svg class="icon sticker cover-heart cover-heart--1" style="color:#fff"><use href="#i-heart"></use></svg>
        <svg class="icon sticker cover-heart cover-heart--2" style="color:var(--butter)"><use href="#i-heart"></use></svg>
        <p class="cover-open-hint" data-text="coverHint"></p>
      </article>


      <article class="page page--bookplate" id="pageBookplate">
        <div class="bookplate-frame">
          <p class="bookplate-label" data-text="bookplateLabel"></p>
          <h3 class="bookplate-name" data-text="bookplateName"></h3>
          <svg class="icon bookplate-squiggle"><use href="#i-squiggle"></use></svg>
          <p class="bookplate-note" data-text="bookplateNote"></p>
        </div>
        <svg class="icon sticker bp-flower" style="color:var(--pink-deep)"><use href="#i-flower"></use></svg>
        <svg class="icon sticker bp-star" style="color:var(--butter-deep)"><use href="#i-star"></use></svg>
        <svg class="icon sticker bp-heart" style="color:var(--lavender-deep)"><use href="#i-heart"></use></svg>
        <span class="washi washi--lavender bp-washi"></span>
      </article>

      <article class="page page--note" id="pageNote">
        <span class="washi washi--pink note-washi"></span>
        <div class="note-body">
          <h3 class="note-title" data-text="noteTitle"></h3>
          <div class="note-text" data-text="noteLines"></div>
        </div>
        <svg class="icon sticker note-heart" style="color:var(--pink-deep)"><use href="#i-heart"></use></svg>
        <svg class="icon sticker note-star" style="color:var(--butter-deep)"><use href="#i-star"></use></svg>
        <svg class="icon sticker note-sparkle" style="color:var(--lavender-deep)"><use href="#i-sparkle"></use></svg>
        <div class="note-flip"><span data-text="noteFlip"></span><svg class="icon"><use href="#i-arrow"></use></svg></div>
        <span class="page-number">1</span>
      </article>


      <article class="page page--checklist" id="pageChecklist">
        <span class="washi washi--lavender check-washi"></span>
        <h3 class="check-title" data-text="checklistTitle"></h3>
        <ul class="checklist" id="checklist"></ul>
        <div class="sticky-note">
          <p data-text="stickyNote"></p>
        </div>
        <svg class="icon sticker check-flower" style="color:var(--pink-deep)"><use href="#i-flower"></use></svg>
        <svg class="icon sticker check-sparkle" style="color:var(--butter-deep)"><use href="#i-sparkle"></use></svg>
        <span class="page-number">2</span>
      </article>


      <article class="page page--question" id="pageQuestion">
        <div class="question-frame">
          <div class="mood-face" id="moodFace" data-mood="happy" aria-hidden="true">
            <span class="bow mood-bow"></span>
            <i class="eye eye--left"></i><i class="eye eye--right"></i>
            <i class="cheek cheek--left"></i><i class="cheek cheek--right"></i>
            <i class="mouth"></i><i class="tear"></i>
          </div>
          <h3 class="question-title" data-text="questionTitle"></h3>
          <p class="question-message" id="questionMessage" aria-live="polite"></p>
          <div class="answer-buttons" id="answerButtons">
            <button class="btn btn--yes" id="yesBtn" data-text="yesButton"></button>
            <button class="btn btn--no" id="noBtn" data-text="noButton"></button>
          </div>
        </div>

        <div class="yes-celebration" id="yesCelebration" aria-live="polite">
          <svg class="icon big-heart"><use href="#i-heart"></use></svg>
          <h3 class="yes-title" data-text="yesTitle"></h3>
          <p class="yes-text" data-text="yesText"></p>
        </div>
        <span class="page-number">3</span>
      </article>

      <article class="page page--gifts" id="pageGifts">
        <span class="washi washi--butter gifts-washi"></span>
        <header class="gifts-header">
          <h3 class="gifts-title" data-text="giftsTitle"></h3>
          <p class="gifts-subtitle" data-text="giftsSubtitle"></p>
        </header>

        <div class="gift-row">
          <button class="gift-card gift-card--pink" data-gift="letter">
            <span class="giftbox giftbox--pink giftbox--dots">
              <span class="giftbox-lid"><span class="bow bow--lavender"></span></span>
              <span class="giftbox-body"></span>
              <span class="giftbox-light"></span>
            </span>
            <svg class="icon sticker gift-charm" style="color:var(--pink-deep)"><use href="#i-heart"></use></svg>
            <span class="gift-tag"><small>Gift 1</small><span data-text="gift1Name"></span></span>
            <span class="gift-badge" aria-hidden="true"><svg class="icon"><use href="#i-check"></use></svg></span>
          </button>

          <button class="gift-card gift-card--lavender" data-gift="world">
            <span class="giftbox giftbox--lavender giftbox--stripes">
              <span class="giftbox-lid"><span class="bow bow--butter"></span></span>
              <span class="giftbox-body"></span>
              <span class="giftbox-light"></span>
            </span>
            <svg class="icon sticker gift-charm" style="color:#fff"><use href="#i-flower"></use></svg>
            <span class="gift-tag"><small>Gift 2</small><span data-text="gift2Name"></span></span>
            <span class="gift-badge" aria-hidden="true"><svg class="icon"><use href="#i-check"></use></svg></span>
          </button>

          <button class="gift-card gift-card--butter" data-gift="fortune">
            <span class="giftbox giftbox--butter giftbox--diamonds">
              <span class="giftbox-lid"><span class="bow"></span></span>
              <span class="giftbox-body"></span>
              <span class="giftbox-light"></span>
            </span>
            <svg class="icon sticker gift-charm" style="color:var(--lavender-deep)"><use href="#i-sparkle"></use></svg>
            <span class="gift-tag"><small>Gift 3</small><span data-text="gift3Name"></span></span>
            <span class="gift-badge" aria-hidden="true"><svg class="icon"><use href="#i-check"></use></svg></span>
          </button>
        </div>

        <p class="gifts-progress" id="giftsProgress" aria-live="polite"></p>
        <svg class="icon sticker gifts-sparkle" style="color:var(--butter-deep)"><use href="#i-sparkle"></use></svg>
        <span class="page-number">4</span>
      </article>


      <article class="page page--secret" id="pageSecret">
        <span class="washi washi--lavender secret-washi"></span>

        <div class="secret-locked" id="secretLocked">
          <svg class="icon secret-locked-icon"><use href="#i-sparkle"></use></svg>
          <p data-text="secretLockedText"></p>
        </div>

        <div class="secret-area" id="secretArea" hidden>
          <p class="secret-teaser" data-text="secretTeaser"></p>
          <button class="mini-envelope" id="secretEnvelopeBtn" aria-label="Open the secret envelope">
            <span class="mini-envelope-flap"></span>
            <span class="mini-envelope-seal"><svg class="icon"><use href="#i-heart"></use></svg></span>
          </button>
          <button class="btn btn--lavender btn--wiggle" id="finaleBtn" data-text="finaleButton" hidden></button>
        </div>

        <svg class="icon sticker secret-heart" style="color:var(--pink-deep)"><use href="#i-heart"></use></svg>
        <span class="page-number">5</span>
      </article>

    </div>
  </section>



  <section class="scene scene--party" id="sceneParty" aria-label="Birthday party room">

    <div class="room" id="room">
      <div class="room-wall" aria-hidden="true"></div>


      <div class="room-top" aria-hidden="true">
        <div class="fairy-lights reveal" id="fairyLights" style="--reveal-delay:.3s">
          <svg viewBox="0 0 100 20" preserveAspectRatio="none"><path d="M0 2 Q25 18 50 2 Q75 18 100 2" fill="none" vector-effect="non-scaling-stroke"/></svg>
        </div>
        <div class="banner" id="banner"></div>
        <div class="hanging-decor reveal" style="--reveal-delay:1.2s">
          <span class="hang hang--1" style="--len:7vh;  --c:var(--butter-deep)"><svg class="icon"><use href="#i-star"></use></svg></span>
          <span class="hang hang--2" style="--len:12vh; --c:var(--pink-deep)"><svg class="icon"><use href="#i-heart"></use></svg></span>
          <span class="hang hang--3" style="--len:11vh; --c:var(--lavender-deep)"><svg class="icon"><use href="#i-heart"></use></svg></span>
          <span class="hang hang--4" style="--len:6vh;  --c:var(--pink-deep)"><svg class="icon"><use href="#i-star"></use></svg></span>
        </div>
      </div>


      <div class="cake-area">

        <div class="balloon-bunch balloon-bunch--left reveal reveal--rise" style="--reveal-delay:1.4s" aria-hidden="true">
          <span class="balloon" style="--c:#FFB7D5; --x:0%;  --y:30%; --delay:0s"></span>
          <span class="balloon" style="--c:#DCD6FF; --x:36%; --y:0%;  --delay:-1.4s"></span>
          <span class="balloon" style="--c:#FFF0B8; --x:62%; --y:36%; --delay:-2.8s"></span>
        </div>
        <div class="balloon-bunch balloon-bunch--right reveal reveal--rise" style="--reveal-delay:1.7s" aria-hidden="true">
          <span class="balloon" style="--c:#CDEFE1; --x:58%; --y:32%; --delay:-.7s"></span>
          <span class="balloon" style="--c:#FFB7D5; --x:24%; --y:0%;  --delay:-2.1s"></span>
          <span class="balloon" style="--c:#DCD6FF; --x:0%;  --y:38%; --delay:-3.5s"></span>
        </div>

        <div class="table-props table-props--left reveal" style="--reveal-delay:2.8s" aria-hidden="true">
          <span class="giftbox giftbox--lavender giftbox--stripes" style="font-size:.9em"><span class="giftbox-lid"><span class="bow bow--butter"></span></span><span class="giftbox-body"></span></span>
          <span class="giftbox giftbox--pink giftbox--dots" style="font-size:.7em; margin-left:-1.2em"><span class="giftbox-lid"><span class="bow bow--lavender"></span></span><span class="giftbox-body"></span></span>
        </div>
        <div class="table-props table-props--right reveal" style="--reveal-delay:3s" aria-hidden="true">
          <span class="vase">
            <span class="stem stem--1"><svg class="icon" style="color:var(--pink-deep)"><use href="#i-flower"></use></svg></span>
            <span class="stem stem--2"><svg class="icon" style="color:#fff"><use href="#i-flower"></use></svg></span>
            <span class="stem stem--3"><svg class="icon" style="color:var(--lavender-deep)"><use href="#i-flower"></use></svg></span>
            <span class="vase-jar"></span>
          </span>
          <span class="giftbox giftbox--butter giftbox--diamonds" style="font-size:.75em; margin-left:.4em"><span class="giftbox-lid"><span class="bow"></span></span><span class="giftbox-body"></span></span>
        </div>


        <div class="cake reveal" id="cake" style="--reveal-delay:2.2s" role="img" aria-label="A big three-tier pink and cream birthday cake with candles">
          <div class="cake-glow"></div>

          <div class="cake-stand">
            <i class="stand-plate"></i><i class="stand-stem"></i><i class="stand-foot"></i>
          </div>


          <div class="tier tier--bottom" id="tierBottom">
            <i class="tier-frost"></i><i class="tier-shine"></i>
            <span class="cake-writing">Happy Birthday</span>
            <svg class="icon tier-deco" style="left:1.2em; top:2.3em; width:1.7em; height:1.7em; color:#fff"><use href="#i-flower"></use></svg>
            <svg class="icon tier-deco" style="left:15.4em; top:2.6em; width:1.5em; height:1.5em; color:var(--lavender)"><use href="#i-flower"></use></svg>
            <svg class="icon tier-deco" style="left:17.4em; top:3.7em; width:1.1em; height:1.1em; color:#fff"><use href="#i-heart"></use></svg>
            <svg class="icon tier-deco" style="left:3.6em; top:4.1em; width:1em; height:1em; color:#fff"><use href="#i-heart"></use></svg>
            <i class="tier-pearls"></i>
            <i class="cut-hole"></i>
          </div>

          <div class="slice-plate" id="slicePlate"></div>
          <div class="cake-slice" id="cakeSlice"></div>
          <div class="cut-seam"></div>

          <div class="tier tier--middle">
            <i class="tier-frost"></i><i class="tier-shine"></i>
            <i class="tier-band"></i>
            <svg class="icon tier-deco" style="left:1.5em; top:4.1em; width:1.4em; height:1.4em; color:var(--pink-deep)"><use href="#i-flower"></use></svg>
            <svg class="icon tier-deco" style="right:1.5em; top:4.1em; width:1.4em; height:1.4em; color:var(--pink-deep)"><use href="#i-flower"></use></svg>
            <i class="tier-pearls"></i>
          </div>
          <span class="bow cake-bow"></span>


          <div class="tier tier--top">
            <i class="tier-frost"></i><i class="tier-shine"></i>
            <svg class="icon tier-deco" style="left:1.3em; top:2.7em; width:1.1em; height:1.1em; color:#fff"><use href="#i-heart"></use></svg>
            <svg class="icon tier-deco" style="left:4.8em; top:3em; width:1.2em; height:1.2em; color:#fff"><use href="#i-heart"></use></svg>
            <svg class="icon tier-deco" style="right:1.3em; top:2.7em; width:1.1em; height:1.1em; color:#fff"><use href="#i-heart"></use></svg>
            <i class="tier-pearls"></i>
          </div>

          <div class="candles" id="candles">
            <span class="candle" style="--cc:var(--pink-deep);     --h:2.8em"><i class="smoke" style="--i:0"></i><i class="flame"></i></span>
            <span class="candle" style="--cc:var(--lavender-deep); --h:3.3em"><i class="smoke" style="--i:1"></i><i class="flame"></i></span>
            <span class="candle" style="--cc:var(--butter-deep);   --h:3em"><i class="smoke" style="--i:2"></i><i class="flame"></i></span>
            <span class="candle" style="--cc:var(--lavender-deep); --h:3.3em"><i class="smoke" style="--i:3"></i><i class="flame"></i></span>
            <span class="candle" style="--cc:var(--pink-deep);     --h:2.8em"><i class="smoke" style="--i:4"></i><i class="flame"></i></span>
          </div>


          <svg class="icon cake-sparkle" style="left:-.5em; top:6em; color:var(--butter-deep)"><use href="#i-sparkle"></use></svg>
          <svg class="icon cake-sparkle" style="right:-.3em; top:3em; color:var(--pink-deep); animation-delay:-.8s"><use href="#i-sparkle"></use></svg>
          <svg class="icon cake-sparkle" style="left:3em; top:.5em; color:var(--lavender-deep); animation-delay:-1.4s"><use href="#i-star"></use></svg>
          <svg class="icon cake-sparkle" style="right:3.4em; top:-1em; color:var(--butter-deep); animation-delay:-.3s"><use href="#i-sparkle"></use></svg>


          <div class="knife" id="knife"></div>
        </div>
      </div>

      <!-- the table and the instruction panel -->
      <div class="table-cloth">
        <div class="party-panel is-empty" id="partyPanel">

          <div class="party-step" data-step="wish">
            <h2 class="party-title" data-text="wishTitle"></h2>
            <p class="party-text" data-text="wishText"></p>
            <button class="btn btn--wiggle" id="wishBtn" data-text="wishButton"></button>
          </div>

          <div class="party-step" data-step="wishDone">
            <h2 class="party-title" data-text="wishDoneTitle"></h2>
            <p class="party-text" data-text="wishDoneText"></p>
          </div>

          <div class="party-step" data-step="candles">
            <h2 class="party-title" data-text="blowTitle"></h2>
            <button class="btn btn--wiggle" id="blowBtn" data-text="blowButton"></button>
          </div>

          <div class="party-step" data-step="blown">
            <h2 class="party-title" data-text="blownTitle"></h2>
            <p class="party-text" data-text="blownText"></p>
          </div>

          <div class="party-step" data-step="cake">
            <h2 class="party-title" data-text="cakeTitle"></h2>
            <p class="party-text" data-text="cakeText"></p>
            <button class="btn btn--wiggle" id="cutBtn" data-text="cutButton"></button>
          </div>

          <div class="party-step" data-step="cut">
            <h2 class="party-title" data-text="cutDoneTitle"></h2>
            <p class="party-text" data-text="cutDoneText"></p>
            <button class="btn btn--lavender btn--wiggle" id="toGiftsBtn" data-text="toGiftsButton"></button>
          </div>

        </div>
      </div>
    </div>

    <div class="dark-overlay" id="darkOverlay">
      <div class="dark-stars" aria-hidden="true">
        <svg class="icon" style="left:12%; top:30%; --s:14px"><use href="#i-sparkle"></use></svg>
        <svg class="icon" style="left:82%; top:22%; --s:10px; animation-delay:-1s"><use href="#i-sparkle"></use></svg>
        <svg class="icon" style="left:70%; top:62%; --s:16px; animation-delay:-2s"><use href="#i-star"></use></svg>
        <svg class="icon" style="left:20%; top:70%; --s:10px; animation-delay:-.5s"><use href="#i-sparkle"></use></svg>
      </div>

      <div class="bulb" id="bulb" aria-hidden="true">
        <span class="bulb-cord"></span>
        <span class="bulb-socket"></span>
        <span class="bulb-glass">
          <svg class="bulb-filament" viewBox="0 0 40 50"><path d="M15 50V32q5-8 10 0v18" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/></svg>
        </span>
        <span class="bulb-glow"></span>
      </div>

      <h2 class="dark-title" data-text="darkTitle"></h2>
      <p class="dark-text" data-text="darkText"></p>

      <button class="light-switch" id="lightSwitch" aria-label="Turn on the lights">
        <span class="switch-plate">
          <span class="switch-screw"></span>
          <span class="switch-slot"><span class="switch-lever"></span></span>
          <span class="switch-screw"></span>
        </span>
        <span class="switch-pointer" aria-hidden="true"><svg class="icon"><use href="#i-arrow"></use></svg></span>
      </button>
    </div>
  </section>

  <section class="scene scene--letter scene--scroll" id="sceneLetter" aria-label="A letter for you">
    <button class="btn btn--small btn--paper back-btn" data-back-to-gifts data-text="backButton"></button>
    <div class="sparkle-field" data-sparkles="10"></div>

    <div class="envelope-stage" id="letterStage">
      <button class="envelope" id="letterEnvelope" aria-label="Open the envelope">
        <span class="envelope-back"></span>
        <span class="envelope-paper"><i></i><i></i><i></i><i></i></span>
        <span class="envelope-pocket"></span>
        <span class="envelope-flap"></span>
        <span class="envelope-seal"><svg class="icon"><use href="#i-heart"></use></svg></span>
      </button>
      <p class="envelope-hint" data-text="envelopeHint"></p>

      <article class="letter-paper" id="letterPaper">
        <svg class="icon sticker letter-flower letter-flower--1" style="color:var(--pink-deep)"><use href="#i-flower"></use></svg>
        <svg class="icon sticker letter-flower letter-flower--2" style="color:var(--lavender-deep)"><use href="#i-flower"></use></svg>
        <svg class="icon sticker letter-heart" style="color:var(--pink-deep)"><use href="#i-heart"></use></svg>
        <h2 class="letter-greeting" data-text="letterGreeting"></h2>
        <div class="letter-text" data-text="letterLines"></div>
        <p class="letter-signoff" data-text="letterSignoff"></p>
        <p class="letter-signature" data-text="letterSignature"></p>
      </article>
    </div>
  </section>

  <section class="scene scene--world scene--scroll" id="sceneWorld" aria-label="Our little world scrapbook">
    <button class="btn btn--small btn--paper back-btn" data-back-to-gifts data-text="backButton"></button>

    <div class="world-inner">
      <h2 class="world-title" data-text="worldTitle"></h2>
      <p class="world-subtitle" data-text="worldSubtitle"></p>

      <div class="world-tabs" role="tablist">
        <button class="tab-btn is-active" role="tab" aria-selected="true" data-tab="photos" data-text="tabPhotos"></button>
        <button class="tab-btn" role="tab" aria-selected="false" data-tab="notes" data-text="tabNotes"></button>
      </div>

      <div class="photo-board" id="photoBoard" role="tabpanel"></div>
      <div class="notes-board" id="notesBoard" role="tabpanel" hidden></div>
    </div>
  </section>


  <section class="scene scene--fortune scene--scroll" id="sceneFortune" aria-label="Birthday fortune machine">
    <button class="btn btn--small btn--paper back-btn" data-back-to-gifts data-text="backButton"></button>
    <div class="sparkle-field" data-sparkles="14"></div>

    <h2 class="fortune-title" data-text="fortuneTitle"></h2>
    <p class="fortune-subtitle" data-text="fortuneSubtitle"></p>

    <div class="fortune-machine" id="fortuneMachine" aria-hidden="true">
      <span class="bow fm-bow"></span>
      <div class="fm-dome">
        <i class="ball" style="--c:#FFB7D5; left:6%;  bottom:4%"></i>
        <i class="ball" style="--c:#DCD6FF; left:30%; bottom:2%"></i>
        <i class="ball" style="--c:#FFF0B8; left:55%; bottom:5%"></i>
        <i class="ball" style="--c:#CDEFE1; left:72%; bottom:18%"></i>
        <i class="ball" style="--c:#FFD6E7; left:16%; bottom:26%"></i>
        <i class="ball" style="--c:#B7A9F5; left:42%; bottom:28%"></i>
        <i class="ball" style="--c:#FFE49A; left:62%; bottom:40%"></i>
        <i class="ball" style="--c:#FF9EC4; left:28%; bottom:50%"></i>
      </div>
      <div class="fm-ring"></div>
      <div class="fm-body">
        <span class="fm-label">&#10022; FORTUNE &#10022;</span>
        <span class="fm-knob"><i></i></span>
        <span class="fm-slot"></span>
        <span class="fm-heart"><svg class="icon"><use href="#i-heart"></use></svg></span>
        <div class="fm-tray">
          <span class="capsule" id="capsule"><i class="capsule-top"></i><i class="capsule-bottom"></i></span>
        </div>
      </div>
      <i class="fm-foot fm-foot--left"></i><i class="fm-foot fm-foot--right"></i>
    </div>

    <div class="fortune-ticket" id="fortuneTicket" aria-live="polite">
      <svg class="icon ticket-sparkle"><use href="#i-sparkle"></use></svg>
      <p id="fortuneText"></p>
    </div>

    <button class="btn btn--wiggle" id="fortuneBtn" data-text="fortuneButton"></button>
  </section>

  <section class="scene scene--final scene--scroll" id="sceneFinal" aria-label="Final birthday wish">
    <div class="hearts-layer" data-hearts></div>
    <div class="sparkle-field" data-sparkles="28"></div>
    <div class="bunting" data-bunting aria-hidden="true"></div>

    <div class="balloon-bunch balloon-bunch--left" aria-hidden="true">
      <span class="balloon" style="--c:#FFB7D5; --x:0%;  --y:30%; --delay:0s"></span>
      <span class="balloon" style="--c:#FFF0B8; --x:40%; --y:0%;  --delay:-1.8s"></span>
      <span class="balloon" style="--c:#DCD6FF; --x:64%; --y:38%; --delay:-3.4s"></span>
    </div>
    <div class="balloon-bunch balloon-bunch--right" aria-hidden="true">
      <span class="balloon" style="--c:#DCD6FF; --x:58%; --y:34%; --delay:-1s"></span>
      <span class="balloon" style="--c:#FFB7D5; --x:20%; --y:0%;  --delay:-2.6s"></span>
      <span class="balloon" style="--c:#CDEFE1; --x:0%;  --y:42%; --delay:-4.2s"></span>
    </div>

    <div class="final-card">
      <span class="washi washi--pink final-washi"></span>
      <span class="bow final-bow"></span>
      <h1 class="final-title" id="finalTitle" data-text="finalTitle" data-wave></h1>
      <div class="final-text" data-text="finalLines"></div>
      <div class="final-actions">
        <button class="btn btn--wiggle" id="replayBtn" data-text="replayButton"></button>
        <button class="btn btn--small btn--lavender" id="finalBackBtn" data-text="backButton"></button>
      </div>
    </div>

    <div class="scallop-floor" aria-hidden="true"></div>
    <span class="cupcake cupcake--left" aria-hidden="true"><i class="cc-wrap"></i><i class="cc-f1"></i><i class="cc-f2"></i><i class="cc-f3"></i><i class="cc-cherry"></i></span>
    <span class="cupcake cupcake--right" style="--wrap:#FFD6E7" aria-hidden="true"><i class="cc-wrap"></i><i class="cc-f1"></i><i class="cc-f2"></i><i class="cc-f3"></i><i class="cc-cherry"></i></span>
  </section>

</main>


<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer" hidden>
  <button class="lightbox-close round-btn" id="lightboxClose" aria-label="Close photo">&times;</button>
  <button class="lightbox-nav lightbox-nav--prev round-btn" id="lightboxPrev" aria-label="Previous photo">&#8249;</button>
  <figure class="lightbox-polaroid" id="lightboxFigure">
    <span class="washi washi--pink lightbox-washi"></span>
    <div class="lightbox-photo" id="lightboxPhoto"></div>
    <figcaption id="lightboxCaption"></figcaption>
  </figure>
  <button class="lightbox-nav lightbox-nav--next round-btn" id="lightboxNext" aria-label="Next photo">&#8250;</button>
</div>

<div class="secret-modal" id="secretModal" role="dialog" aria-modal="true" aria-label="A secret note" hidden>
  <div class="envelope-stage envelope-stage--lavender" id="secretStage">
    <div class="envelope">
      <span class="envelope-back"></span>
      <span class="envelope-paper"><i></i><i></i><i></i><i></i></span>
      <span class="envelope-pocket"></span>
      <span class="envelope-flap"></span>
      <span class="envelope-seal"><svg class="icon"><use href="#i-heart"></use></svg></span>
    </div>

    <article class="letter-paper secret-note" id="secretNote">
      <svg class="icon sticker letter-heart" style="color:var(--lavender-deep)"><use href="#i-heart"></use></svg>
      <h2 class="letter-greeting" data-text="secretTitle"></h2>
      <div class="letter-text" data-text="secretLines"></div>
      <div class="secret-actions">
        <button class="btn btn--small btn--paper" id="secretCloseBtn" data-text="secretClose"></button>
        <button class="btn btn--small btn--lavender" id="secretContinueBtn" data-text="secretContinue"></button>
      </div>
    </article>
  </div>
</div>

<!-- Confetti and sparkle bursts are drawn here -->
<div class="effects-layer" id="effectsLayer" aria-hidden="true"></div>

<!-- Iris wipe used between big scenes -->
<div class="wipe" id="wipe" aria-hidden="true">
  <span class="bow wipe-bow"></span>
</div>

<!-- Music toggle (works only after the user clicks; autoplay is never assumed) -->
<button class="music-btn" id="musicBtn" aria-pressed="false">
  <svg class="icon"><use href="#i-music"></use></svg>
  <span id="musicLabel"></span>
</button>
<audio id="bgMusic" preload="none"></audio>


<div class="toast" id="toast" role="status" aria-live="polite"></div>

<noscript><p class="noscript">This birthday surprise needs JavaScript to work. Please turn it on! 💗</p></noscript>
<script src="script.js"></script>
</body>
</html>
